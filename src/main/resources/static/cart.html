<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - E-Commerce</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ----- NAVBAR ----- -->

<div id="navbar"></div>


<main>

    <!-- ----- CART ----- -->

    <section class="cart-page">

        <div class="container">

            <div class="cart-heading">

                <div>
                    <span class="home-section-label">
                        SHOPPING CART
                    </span>

                    <h1>
                        My Cart
                    </h1>

                    <p>
                        Review your selected products before checkout.
                    </p>
                </div>

                <a href="products.html"
                   class="btn btn-outline-primary cart-shopping-btn">
                    <i class="bi bi-arrow-left me-2"></i>
                    Continue Shopping
                </a>

            </div>


            <!-- ----- MESSAGE ----- -->

            <div id="message"></div>


            <div class="row g-4 align-items-start">

                <!-- ----- CART ITEMS ----- -->

                <div class="col-lg-8">

                    <div class="cart-section-card">

                        <div class="cart-section-header">

                            <div>
                                <h5>
                                    <i class="bi bi-bag me-2"></i>
                                    Your Items
                                </h5>

                                <p>
                                    Products selected for your order
                                </p>
                            </div>

                        </div>

                        <div id="cartContainer">
                            <!-- Cart items will be loaded here -->
                        </div>

                    </div>

                </div>


                <!-- ----- CART SUMMARY ----- -->

                <div class="col-lg-4">

                    <div id="cartSummary"
                         class="cart-summary-card">

                        <!-- Cart total will be shown here -->

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>


<!-- ----- ORDER SUCCESS MODAL ----- -->

<div id="orderSuccessModal"
     class="success-modal">

    <div class="success-modal-content">

        <button
                type="button"
                id="closeSuccessModal"
                class="success-modal-close"
                aria-label="Close">

            <i class="bi bi-x-lg"></i>

        </button>


        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>


        <p class="success-modal-label">
            ORDER CONFIRMED
        </p>

        <h3>
            Order Placed Successfully!
        </h3>

        <p class="text-muted">
            Thank you for your purchase.
            Your order has been placed successfully.
        </p>
        <div class="success-modal-actions">

            <button
                    id="viewOrderButton"
                    class="btn btn-primary">

                <i class="bi bi-box-seam me-2"></i>
                View Order

            </button>

            <a
                    href="products.html"
                    class="btn btn-outline-secondary">

                Continue Shopping

            </a>

        </div>

    </div>

</div>


<!-- ----- FOOTER ----- -->

<div id="footer"></div>


<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/cart.js"></script>

</body>
</html>
