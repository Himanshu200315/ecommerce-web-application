<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - E-Commerce</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ----- NAVBAR ----- -->

<div id="navbar"></div>


<main>

    <!-- ----- PRODUCTS HEADER ----- -->

    <section class="products-page">

        <div class="container">

            <div class="products-heading">

                <div>
                    <span class="home-section-label">
                        OUR COLLECTION
                    </span>

                    <h1>
                        Explore Products
                    </h1>

                    <p>
                        Discover products and find something
                        that fits what you're looking for.
                    </p>
                </div>

            </div>


            <!-- ----- SEARCH ----- -->

            <div class="product-toolbar">

                <div class="product-search">

                    <i class="bi bi-search"></i>

                    <input
                            type="text"
                            id="searchInput"
                            class="form-control"
                            placeholder="Search products...">

                </div>

                <div class="product-sort">

                    <i class="bi bi-funnel"></i>

                    <select
                            id="sortSelect"
                            class="form-select">

                        <option value="">
                            Sort products
                        </option>

                        <option value="price,asc">
                            Price: Low to High
                        </option>

                        <option value="price,desc">
                            Price: High to Low
                        </option>

                        <option value="name,asc">
                            Name: A-Z
                        </option>

                        <option value="name,desc">
                            Name: Z-A
                        </option>

                    </select>

                </div>

            </div>


            <!-- ----- MESSAGE ----- -->

            <div id="message"></div>


            <!-- ----- PRODUCTS ----- -->

            <div
                    id="productContainer"
                    class="row g-4 product-grid">

                <!-- Products loaded using JavaScript -->

            </div>


            <!-- ----- PAGINATION ----- -->

            <div class="product-pagination">

                <button
                        id="previousButton"
                        class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left me-1"></i>
                    Previous

                </button>

                <div
                        id="pageNumber"
                        class="product-page-number">

                    Page 1

                </div>

                <button
                        id="nextButton"
                        class="btn btn-primary">

                    Next
                    <i class="bi bi-arrow-right ms-1"></i>

                </button>

            </div>

        </div>

    </section>

</main>


<!-- ----- FOOTER ----- -->

<div id="footer"></div>


<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/products.js"></script>

</body>
</html>
