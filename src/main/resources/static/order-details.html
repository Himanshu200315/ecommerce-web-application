<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details - E-Commerce</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ----- NAVBAR ----- -->

<div id="navbar"></div>


<main>

    <!-- ----- ORDER DETAILS ----- -->

    <section class="order-details-page">

        <div class="container">

            <div class="order-details-heading">

                <div>
                    <span class="home-section-label">
                        ORDER INFORMATION
                    </span>

                    <h1>
                        Order Details
                    </h1>

                    <p>
                        View your order information and purchased items.
                    </p>
                </div>

                <a
                        href="orders.html"
                        class="btn btn-outline-primary">

                    <i class="bi bi-arrow-left me-2"></i>
                    My Orders

                </a>

            </div>


            <!-- ----- MESSAGE ----- -->

            <div id="message"></div>


            <!-- ----- LOADING ----- -->

            <div id="loading"
                 class="order-loading">

                <div class="spinner-border text-primary"
                     role="status">

                    <span class="visually-hidden">
                        Loading...
                    </span>

                </div>

                <p>
                    Loading order details...
                </p>

            </div>


            <!-- ----- ORDER CONTENT ----- -->

            <div id="orderContainer" class="d-none">

                <!-- ----- ORDER SUMMARY ----- -->

                <div class="order-summary-card">

                    <div class="order-summary-header">

                        <div>
                            <span class="home-section-label">
                                ORDER STATUS
                            </span>

                            <h2>
                                Your Order
                            </h2>
                        </div>

                        <div id="orderStatus">
                            -
                        </div>

                    </div>


                    <div class="order-summary-details">

                        <div class="order-summary-item">

                            <div class="order-summary-icon">
                                <i class="bi bi-calendar3"></i>
                            </div>

                            <div>
                                <span>
                                    Order Date
                                </span>

                                <strong id="orderDate">
                                    -
                                </strong>
                            </div>

                        </div>


                        <div class="order-summary-item">

                            <div class="order-summary-icon">
                                <i class="bi bi-wallet2"></i>
                            </div>

                            <div>
                                <span>
                                    Total Amount
                                </span>

                                <strong id="orderTotal">
                                    -
                                </strong>
                            </div>

                        </div>

                    </div>

                </div>


                <!-- ----- ORDER ITEMS ----- -->

                <div class="order-items-card">

                    <div class="order-items-header">

                        <div>
                            <span class="home-section-label">
                                PURCHASE
                            </span>

                            <h3>
                                Order Items
                            </h3>
                        </div>

                    </div>

                    <div id="orderItems">
                        <!-- Items loaded using JavaScript -->
                    </div>

                </div>

            </div>

        </div>

    </section>

</main>


<!-- ----- FOOTER ----- -->

<div id="footer"></div>


<script src="js/ui.js"></script>
<script src="js/components.js"></script>
<script src="js/order-details.js"></script>

</body>
</html>
